---
- name: Service user
  ansible.builtin.user:
    name: "{{ servis_kullanici }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Directories
  ansible.builtin.file:
    path: "{{ item.yol }}"
    state: directory
    owner: "{{ item.sahip }}"
    group: "{{ item.grup }}"
    mode: "{{ item.mod }}"
  loop:
    - { yol: "{{ kok_dizin }}", sahip: root, grup: root, mod: "0755" }
    - { yol: "{{ kok_dizin }}/releases", sahip: root, grup: root, mod: "0755" }
    - { yol: "{{ kok_dizin }}/yukle", sahip: root, grup: root, mod: "0700" }
    - { yol: "{{ veri_dizini }}", sahip: "{{ servis_kullanici }}", grup: "{{ servis_kullanici }}", mod: "0750" }
    - { yol: "{{ yedek_dizini }}", sahip: "{{ servis_kullanici }}", grup: "{{ servis_kullanici }}", mod: "0700" }
    - { yol: /etc/alig, sahip: root, grup: "{{ servis_kullanici }}", mod: "0750" }

- name: Secret salt (generated only on first installation, does not enter the repository)
  ansible.builtin.shell: |
    umask 077
    printf 'ALIG_FORM_SALT=%s\n' "$(openssl rand -hex 32)" > /etc/alig/env
  args:
    creates: /etc/alig/env
- name: Audit chain key (added if missing, an existing key does not change)
  ansible.builtin.shell: |
    umask 077
    grep -q '^ALIG_DENETIM_ANAHTARI=' /etc/alig/env || printf 'ALIG_DENETIM_ANAHTARI=%s\n' "$(openssl rand -hex 32)" >> /etc/alig/env
  changed_when: false
- name: Environment file permissions
  ansible.builtin.file:
    path: /etc/alig/env
    owner: root
    group: "{{ servis_kullanici }}"
    mode: "0640"

- name: systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - alig-form.service
    - alig-tarama.service
    - alig-yonetim.service
    - alig-bakim.service
    - alig-bakim.timer
    - alig-izleme.service
    - alig-izleme.timer
  notify: systemd reload

- name: Runner user (Mode B)
  ansible.builtin.user:
    name: "{{ calistirici_kullanici }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: dogrudan_baglanti

- name: Runner unit (Mode B)
  ansible.builtin.template:
    src: alig-calistirici.service.j2
    dest: /etc/systemd/system/alig-calistirici.service
    mode: "0644"
  when: dogrudan_baglanti
  notify: systemd reload

- name: While Mode B is off, the runner unit is removed
  ansible.builtin.file:
    path: /etc/systemd/system/alig-calistirici.service
    state: absent
  when: not dogrudan_baglanti
  notify: systemd reload

- name: E-mail verification settings are complete
  ansible.builtin.assert:
    that:
      - smtp_sunucu | length > 0
      - "'@' in eposta_gonderen"
    fail_msg: "for eposta_dogrulama: true, smtp_sunucu and eposta_gonderen must be filled in"
  when: eposta_dogrulama

- name: The customer portal opens only together with e-mail verification
  ansible.builtin.assert:
    that:
      - eposta_dogrulama
    fail_msg: "for musteri_portali: true, eposta_dogrulama: true is required"
  when: musteri_portali

- name: Mail unit (e-mail verification)
  ansible.builtin.template:
    src: alig-posta.service.j2
    dest: /etc/systemd/system/alig-posta.service
    mode: "0644"
  when: eposta_dogrulama
  notify: systemd reload

- name: While e-mail verification is off, the mail unit is removed
  ansible.builtin.file:
    path: /etc/systemd/system/alig-posta.service
    state: absent
  when: not eposta_dogrulama
  notify: systemd reload

- name: Enable the timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [alig-bakim.timer, alig-izleme.timer]
  # alig-form and alig-tarama start after the first release (the code is not there yet)

- name: Alert unit, a critical entry in the system log by default
  ansible.builtin.copy:
    dest: /etc/systemd/system/alig-uyari.service
    mode: "0644"
    content: |
      [Unit]
      Description=alig.tech monitoring failed
      [Service]
      Type=oneshot
      # [doldurulacak: bildirim yontemi]  example: an e-mail or message channel command (to be filled in: notification method)
      ExecStart=/usr/bin/logger -p user.crit "alig-izleme failed: journalctl -u alig-izleme"
  notify: systemd reload
