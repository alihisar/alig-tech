---
- name: Packages
  ansible.builtin.apt:
    name: [ufw, unattended-upgrades, chrony, python3, sqlite3, logrotate, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Automatic security updates (restart by hand)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52alig-otomatik
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Firewall, deny by default
  community.general.ufw:
    default: deny
    direction: incoming
- name: Firewall, outbound allowed
  community.general.ufw:
    default: allow
    direction: outgoing
- name: Firewall, allowed ports (ssh rate limited)
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: tcp
  loop:
    - { rule: limit, port: "{{ ssh_port }}" }
    - { rule: allow, port: "80" }
    - { rule: allow, port: "443" }
- name: Turn on the firewall
  community.general.ufw:
    state: enabled

- name: SSH hardening (does not lock itself out if there is no key)
  block:
    - name: Does the administration user have an authorised key
      ansible.builtin.stat:
        path: "/home/{{ yonetim_kullanici }}/.ssh/authorized_keys"
      register: anahtar
    - name: Stop if there is no key
      ansible.builtin.assert:
        that: anahtar.stat.exists and anahtar.stat.size > 0
        fail_msg: "{{ yonetim_kullanici }} has no authorized_keys: add a key before turning off password login."
    - name: sshd drop-in
      ansible.builtin.template:
        src: sshd-alig.conf.j2
        dest: /etc/ssh/sshd_config.d/10-alig.conf
        mode: "0644"
        backup: true
      register: sshd_conf
    - name: Validate the sshd setting
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: sshd_conf.changed
  rescue:
    - name: Remove the invalid drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/10-alig.conf
        state: absent
    - name: Stop
      ansible.builtin.fail:
        msg: "SSH hardening could not be applied, the drop-in was removed. Examine the error above."

- name: chrony is running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
