---
- name: Paketler
  ansible.builtin.apt:
    name: [ufw, unattended-upgrades, chrony, python3, sqlite3, logrotate, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Otomatik guvenlik guncellemeleri (yeniden baslatma elle)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52alig-otomatik
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Guvenlik duvari, varsayilan reddet
  community.general.ufw:
    default: deny
    direction: incoming
- name: Guvenlik duvari, giden izinli
  community.general.ufw:
    default: allow
    direction: outgoing
- name: Guvenlik duvari, izinli portlar (ssh hizla sinirli)
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: tcp
  loop:
    - { rule: limit, port: "{{ ssh_port }}" }
    - { rule: allow, port: "80" }
    - { rule: allow, port: "443" }
- name: Guvenlik duvarini ac
  community.general.ufw:
    state: enabled

- name: SSH sertlestirme (anahtar yoksa kendini kilitlemez)
  block:
    - name: Yonetim kullanicisinin yetkili anahtari var mi
      ansible.builtin.stat:
        path: "/home/{{ yonetim_kullanici }}/.ssh/authorized_keys"
      register: anahtar
    - name: Anahtar yoksa dur
      ansible.builtin.assert:
        that: anahtar.stat.exists and anahtar.stat.size > 0
        fail_msg: "{{ yonetim_kullanici }} icin authorized_keys yok: parola girisini kapatmadan once anahtar ekleyin."
    - name: sshd drop-in
      ansible.builtin.template:
        src: sshd-alig.conf.j2
        dest: /etc/ssh/sshd_config.d/10-alig.conf
        mode: "0644"
        backup: true
      register: sshd_conf
    - name: sshd ayarini dogrula
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
    - name: sshd yeniden yukle
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: sshd_conf.changed
  rescue:
    - name: Gecersiz drop-in'i kaldir
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/10-alig.conf
        state: absent
    - name: Durdur
      ansible.builtin.fail:
        msg: "SSH sertlestirme uygulanamadi, drop-in kaldirildi. Yukaridaki hatayi inceleyin."

- name: chrony calisiyor
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
