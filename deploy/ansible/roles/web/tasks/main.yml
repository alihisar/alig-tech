---
- name: Has the certificate e-mail been filled in
  ansible.builtin.assert:
    that: "'doldurulacak' not in certbot_eposta"
    fail_msg: "Fill in the certbot_eposta value in group_vars/all.yml."

- name: nginx and certbot
  ansible.builtin.apt:
    name: [nginx, certbot]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: nginx reload

- name: ACME directory
  ansible.builtin.file:
    path: /var/www/acme
    state: directory
    mode: "0755"

- name: nginx fragments (headers, locations, log format)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/nginx/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: alig-basliklar.conf.j2, dest: snippets/alig-basliklar.conf }
    - { src: alig-genel.conf.j2, dest: conf.d/alig-genel.conf }
  notify: nginx reload

- name: Is there a certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ alan_adi }}/fullchain.pem"
  register: sertifika

- name: HTTP-only site (until the certificate is obtained)
  ansible.builtin.template:
    src: alig-http.conf.j2
    dest: /etc/nginx/sites-available/alig.conf
    mode: "0644"
  when: not sertifika.stat.exists
  notify: nginx reload

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/alig.conf
    dest: /etc/nginx/sites-enabled/alig.conf
    state: link
  notify: nginx reload

- name: Load the HTTP site (for certbot)
  ansible.builtin.meta: flush_handlers

- name: Obtain the certificate, the DNS records must be ready (docs/dns.md)
  ansible.builtin.command: >
    certbot certonly --webroot -w /var/www/acme --non-interactive --agree-tos
    -m {{ certbot_eposta }} -d {{ alan_adi }} -d {{ www_alani }}
  args:
    creates: "/etc/letsencrypt/live/{{ alan_adi }}/fullchain.pem"

- name: Reload nginx after renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/alig-nginx.sh
    mode: "0755"
    content: |
      #!/bin/sh
      systemctl reload nginx

- name: Full HTTPS site
  ansible.builtin.template:
    src: alig-https.conf.j2
    dest: /etc/nginx/sites-available/alig.conf
    mode: "0644"
  notify: nginx reload

- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Log retention period
  ansible.builtin.template:
    src: logrotate-alig.j2
    dest: /etc/logrotate.d/alig-nginx
    mode: "0644"

- name: nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
