---
- name: Is there a previous release
  ansible.builtin.stat:
    path: "{{ kok_dizin }}/onceki"
  register: onceki
- name: Stop if not
  ansible.builtin.assert:
    that: onceki.stat.exists
    fail_msg: "There is no previous release record to return to."
- name: Current and previous release
  ansible.builtin.shell: |
    printf 'simdiki=%s onceki=%s\n' "$(basename "$(readlink -f {{ kok_dizin }}/current)")" "$(basename "$(readlink -f {{ kok_dizin }}/onceki)")"
  register: durum
  changed_when: false
- name: Info
  ansible.builtin.debug:
    msg: "{{ durum.stdout }}"
- name: Return to the previous release
  ansible.builtin.include_tasks: baglanti.yml
  vars:
    hedef: onceki
- name: Restart the services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: [alig-form, alig-tarama, alig-yonetim]
- name: Smoke test
  ansible.builtin.command: python3 {{ kok_dizin }}/current/deploy/duman_testi.py http://127.0.0.1:{{ yerel_izleme_portu }}
  register: duman
  retries: 5
  delay: 3
  until: duman.rc == 0
  changed_when: false
