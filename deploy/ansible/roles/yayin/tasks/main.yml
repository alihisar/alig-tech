---
# Release publishing: upload, verify, unpack, switch the link, smoke test, roll back on error.
- name: Required variables
  ansible.builtin.assert:
    that:
      - surum is defined
      - surum is match('^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$')
      - paket is defined
    fail_msg: "ansible-playbook yayin.yml -e surum=1.0.0 -e paket=../../dist/alig-site-1.0.0.tar.gz"

- name: Do the local package and digest file exist
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  loop: ["{{ paket }}", "{{ paket }}.sha256"]
  register: yerel_paket
- name: Stop if missing
  ansible.builtin.assert:
    that: yerel_paket.results | map(attribute='stat.exists') | min
    fail_msg: "The package or .sha256 file is missing: run deploy/paketle.py first."

- name: Copy the package to the server
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ kok_dizin }}/yukle/{{ item | basename }}"
    mode: "0600"
  loop: ["{{ paket }}", "{{ paket }}.sha256"]

- name: Verify the package digest on the server
  ansible.builtin.command: sha256sum -c {{ (paket ~ '.sha256') | basename }}
  args:
    chdir: "{{ kok_dizin }}/yukle"
  changed_when: false

- name: Release directory
  ansible.builtin.file:
    path: "{{ kok_dizin }}/releases/{{ surum }}"
    state: directory
    mode: "0755"

- name: Unpack the package
  ansible.builtin.unarchive:
    src: "{{ kok_dizin }}/yukle/{{ paket | basename }}"
    dest: "{{ kok_dizin }}/releases/{{ surum }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ kok_dizin }}/releases/{{ surum }}/VERSION"

- name: Verify the unpacked files against the manifest
  ansible.builtin.shell: sha256sum -c --quiet MANIFEST.sha256
  args:
    chdir: "{{ kok_dizin }}/releases/{{ surum }}"
  changed_when: false

- name: Current release (returned to on error)
  ansible.builtin.shell: readlink -f {{ kok_dizin }}/current 2>/dev/null || true
  register: simdiki
  changed_when: false

- name: Release (return to the previous release on error)
  block:
    - name: Record the previous link
      ansible.builtin.shell: |
        set -e
        cd {{ kok_dizin }}
        if [ -L current ]; then ln -sfn "$(readlink current)" onceki.new && mv -T onceki.new onceki; fi
      when: simdiki.stdout | length > 0
      changed_when: true
    - name: Change the link
      ansible.builtin.include_tasks: baglanti.yml
      vars:
        hedef: "releases/{{ surum }}"
    - name: Restart the services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
        daemon_reload: true
      loop: "{{ ['alig-form', 'alig-tarama', 'alig-yonetim'] + (['alig-calistirici'] if dogrudan_baglanti else []) + (['alig-posta'] if eposta_dogrulama else []) }}"
    - name: nginx reload
      ansible.builtin.service:
        name: nginx
        state: reloaded
    - name: Smoke test (local)
      ansible.builtin.command: >
        python3 {{ kok_dizin }}/current/deploy/duman_testi.py
        http://127.0.0.1:{{ yerel_izleme_portu }} --surum {{ surum }}
      register: duman
      retries: 5
      delay: 3
      until: duman.rc == 0
      changed_when: false
  rescue:
    - name: Return to the previous release
      ansible.builtin.include_tasks: baglanti.yml
      vars:
        hedef: "{{ simdiki.stdout }}"
      when: simdiki.stdout | length > 0
    - name: Restart the services (rollback)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ ['alig-form', 'alig-tarama', 'alig-yonetim'] + (['alig-calistirici'] if dogrudan_baglanti else []) + (['alig-posta'] if eposta_dogrulama else []) }}"
      when: simdiki.stdout | length > 0
    - name: Release failed
      ansible.builtin.fail:
        msg: >-
          Release {{ surum }} failed and
          {{ 'returned to the previous release (' ~ simdiki.stdout ~ ')' if simdiki.stdout | length > 0 else 'there is no previous release to return to (first release)' }}.
          Details: journalctl -u alig-form -u alig-tarama -n 100

- name: Verify from outside (through the domain name)
  ansible.builtin.uri:
    url: "https://{{ alan_adi }}/surum.txt"
    return_content: true
  delegate_to: localhost
  become: false
  register: dis
  until: dis.content | default('') | trim == surum
  retries: 10
  delay: 3
  when: dis_kontrol | default(true) | bool

- name: Clean up old releases (the last {{ surum_saklama_adet }} are kept, current and onceki are never deleted)
  ansible.builtin.shell: |
    set -e
    cd {{ kok_dizin }}/releases
    keep_a=$(basename "$(readlink -f ../current)")
    keep_b=$(basename "$(readlink -f ../onceki 2>/dev/null || echo none)")
    ls -1 | sort -V | head -n -{{ surum_saklama_adet }} | while read r; do
      [ "$r" = "$keep_a" ] || [ "$r" = "$keep_b" ] || rm -rf -- "$r"
    done
  changed_when: false
