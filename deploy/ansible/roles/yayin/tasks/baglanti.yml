---
# Changes the current link atomically (rename). 'hedef' is a path relative to kok_dizin.
- name: Change the current link
  ansible.builtin.shell: |
    set -e
    cd {{ kok_dizin }}
    t="$(readlink -f {{ hedef }})"
    [ -d "$t" ] || { echo "hedef yok: {{ hedef }}"; exit 1; }
    ln -sfn "$t" current.new
    mv -T current.new current
  changed_when: true
