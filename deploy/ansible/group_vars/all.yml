---
alan_adi: alig.tech
www_alani: www.alig.tech
ssh_port: 22
# The administration user who logs in to the server with a key (same as ansible_user in the inventory)
yonetim_kullanici: deploy
certbot_eposta: "[doldurulacak: e-posta]"
hsts_saniye: 31536000
log_saklama_gun: 30
yedek_saklama_adet: 14
surum_saklama_adet: 5
servis_kullanici: alig-web
kok_dizin: /srv/alig
veri_dizini: /var/lib/alig
yedek_dizini: /var/backups/alig
form_portu: 8090
tarama_portu: 8091
yerel_izleme_portu: 8081
yonetim_portu: 8092
# IP addresses allowed to reach the admin panel from the internet. If empty, the panel is NOT exposed to the internet;
# it is reached through an SSH tunnel: ssh -L 8092:127.0.0.1:8092 deploy@server  ->  http://localhost:8092/yonetim/
yonetim_izinli_ipler: []
# Mode B (scan with a direct connection). While false, the runner service is NOT installed and the feature stays off.
# Before turning it on: the "before going live" items in docs/kip-b-tasarim.md.
dogrudan_baglanti: false
calistirici_kullanici: alig-calistirici
# Our own address ranges: the runner refuses to connect to these networks. Example: ["203.0.113.0/24"]
calistirici_yasak_aglar: []
# E-mail verification. While false, the report link is shown right after the upload and the e-mail address is not verified.
# For true: smtp_sunucu and eposta_gonderen must be filled in and ALIG_SMTP_PAROLA=... must be written by hand into /etc/alig/env.
eposta_dogrulama: false
smtp_sunucu: ""
smtp_port: 587
smtp_kullanici: ""
eposta_gonderen: ""
# Customer portal (/portal/). Default OFF. For true, eposta_dogrulama must also be true: when an account is opened, e-mail ownership
# is verified. It is not turned on in production until real SMTP sending has been set up and tried.
musteri_portali: false

