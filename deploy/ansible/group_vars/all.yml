---
alan_adi: alig.tech
www_alani: www.alig.tech
ssh_port: 22
# Sunucuya anahtarla girilen yonetim kullanicisi (inventory'deki ansible_user ile ayni)
yonetim_kullanici: deploy
certbot_eposta: "[doldurulacak: e-posta]"
hsts_saniye: 31536000
log_saklama_gun: 30
yedek_saklama_adet: 14
surum_saklama_adet: 5
servis_kullanici: alig-web
kok_dizin: /srv/alig
veri_dizini: /var/lib/alig
yedek_dizini: /var/backups/alig
form_portu: 8090
tarama_portu: 8091
yerel_izleme_portu: 8081
yonetim_portu: 8092
# Yonetim paneline internetten izin verilen IP adresleri. Bos ise panel internete ACILMAZ;
# SSH tuneli ile erisilir: ssh -L 8092:127.0.0.1:8092 deploy@sunucu  ->  http://localhost:8092/yonetim/
yonetim_izinli_ipler: []
# Kip B (dogrudan baglantili tarama). false iken calistirici servisi KURULMAZ ve ozellik kapali kalir.
# Acmadan once: docs/kip-b-tasarim.md icindeki "canliya almadan once" maddeleri.
dogrudan_baglanti: false
calistirici_kullanici: alig-calistirici
# Kendi adres araliklarimiz: calistirici bu aglara baglanmayi reddeder. Ornek: ["203.0.113.0/24"]
calistirici_yasak_aglar: []
# E-posta dogrulamasi. false iken rapor baglantisi yuklemeden hemen sonra gosterilir ve e-posta adresi dogrulanmaz.
# true icin: smtp_sunucu, eposta_gonderen dolu olmali ve /etc/alig/env icine ALIG_SMTP_PAROLA=... elle yazilmali.
eposta_dogrulama: false
smtp_sunucu: ""
smtp_port: 587
smtp_kullanici: ""
eposta_gonderen: ""

