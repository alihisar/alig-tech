<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots_meta_html}}
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="tr" href="{{alt_tr}}">
<link rel="alternate" hreflang="en" href="{{alt_en}}">
<link rel="alternate" hreflang="x-default" href="{{alt_tr}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta name="theme-color" content="#2a3fd6">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/js-flag.js"></script>
{{jsonld_html}}
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{home}}"><img src="/assets/logo.svg" width="176" height="36" alt="{{site_name}}"></a>
    <nav aria-label="{{nav_label}}">
      <a href="{{home}}#hizmetler">{{nav_services}}</a>
      <a href="{{home}}#nasil">{{nav_how}}</a>
      <a href="{{home}}saglik-taramasi/">{{nav_tarama}}</a>
      <a href="{{home}}demo/">{{nav_demo}}</a>
      <a href="{{home}}#guvenlik">{{nav_security}}</a>
      <a href="{{home}}#iletisim">{{nav_contact}}</a>
    </nav>
    <a class="lang" href="{{other_href}}" hreflang="{{other_lang}}" lang="{{other_lang}}" aria-label="{{switch_label}}">{{switch_text}}</a>
    <a class="btn btn-sm" href="{{home}}#iletisim">{{cta}}</a>
  </div>
</header>
<main id="main">
{{body_html}}
</main>
<footer class="foot">
  <div class="wrap foot-in">
    <p>{{foot_copy}}, {{foot_city}}</p>
    <p>{{foot_mail}}</p>
    <nav aria-label="{{foot_kvkk}}">
      <a href="{{kvkk_href}}">{{foot_kvkk}}</a>
      <a href="{{cerez_href}}">{{foot_cookie}}</a>
    </nav>
  </div>
</footer>
{{scripts_html}}
</body>
</html>
