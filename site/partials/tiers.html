<section id="kademeler" class="sec sec-tiers" aria-labelledby="h-tiers">
  <div class="wrap sec-in">
    <header class="sec-head">
      <h2 id="h-tiers">{{sec_tiers_h}}</h2>
      <p class="lead">{{tiers_default}}</p>
    </header>
    <div class="sec-body">
      <table class="tiers">
        <thead>
          <tr>
            <th scope="col">{{tier_col_level}}</th>
            <th scope="col">{{tier_col_does}}</th>
            <th scope="col">{{tier_col_who}}</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">{{tier1_name}}</th>
            <td data-label="{{tier_col_does}}">{{tier1_does}}</td>
            <td data-label="{{tier_col_who}}">{{tier1_who}}</td>
          </tr>
          <tr>
            <th scope="row">{{tier2_name}}</th>
            <td data-label="{{tier_col_does}}">{{tier2_does}}</td>
            <td data-label="{{tier_col_who}}">{{tier2_who}}</td>
          </tr>
          <tr>
            <th scope="row">{{tier3_name}}</th>
            <td data-label="{{tier_col_does}}">{{tier3_does}}</td>
            <td data-label="{{tier_col_who}}">{{tier3_who}}</td>
          </tr>
          <tr>
            <th scope="row">{{tier4_name}}</th>
            <td data-label="{{tier_col_does}}">{{tier4_does}}</td>
            <td data-label="{{tier_col_who}}">{{tier4_who}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
