<section id="nasil" class="sec sec-how" aria-labelledby="h-how">
  <div class="wrap sec-in">
    <header class="sec-head">
      <h2 id="h-how">{{sec_how_h}}</h2>
      <p class="lead">{{sec_how_lead}}</p>
    </header>
    <div class="sec-body">
      <figure class="flow">
        <ol class="flow-steps" aria-label="{{flow_title}}">
          <li class="flow-step" tabindex="0"><span class="flow-name">{{flow_1}}</span><span class="flow-actor">{{flow_agent}}</span><span class="flow-tip">{{flow_1_d}}</span></li>
          <li class="flow-step" tabindex="0"><span class="flow-name">{{flow_2}}</span><span class="flow-actor">{{flow_agent}}</span><span class="flow-tip">{{flow_2_d}}</span></li>
          <li class="flow-step" tabindex="0"><span class="flow-name">{{flow_3}}</span><span class="flow-actor">{{flow_agent}}</span><span class="flow-tip">{{flow_3_d}}</span></li>
          <li class="flow-step" tabindex="0"><span class="flow-name">{{flow_4}}</span><span class="flow-actor">{{flow_agent}}</span><span class="flow-tip">{{flow_4_d}}</span></li>
          <li class="flow-step flow-you" tabindex="0"><span class="flow-name">{{flow_5}}</span><span class="flow-actor">{{flow_you}}</span><span class="flow-tip">{{flow_5_d}}</span></li>
          <li class="flow-step" tabindex="0"><span class="flow-name">{{flow_6}}</span><span class="flow-actor">{{flow_agent}}</span><span class="flow-tip">{{flow_6_d}}</span></li>
          <li class="flow-step" tabindex="0"><span class="flow-name">{{flow_7}}</span><span class="flow-actor">{{flow_agent}}</span><span class="flow-tip">{{flow_7_d}}</span></li>
        </ol>
        <div class="flow-actors" aria-hidden="true"><span>{{flow_agent}}</span><span class="flow-actors-you">{{flow_you}}</span><span>{{flow_agent}}</span></div>
        <figcaption>{{flow_caption}} <span class="flow-hint">{{flow_hint}}</span></figcaption>
      </figure>
    </div>
  </div>
</section>
